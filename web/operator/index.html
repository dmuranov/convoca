<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola — Plazo Abierto</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .cols { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  details.card { padding: .8rem 1.2rem; }
  summary { cursor: pointer; font-weight: 600; }
  .row-actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin: .4rem 0; }
  .row-actions input, .row-actions select { width: auto; margin: 0; }
  pre.draft { background: var(--bg); padding: .6rem; border-radius: 8px; white-space: pre-wrap; font-size: .85rem; }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="logo" href="/">Plazo<span class="b">Abierto</span>&nbsp;· consola</a>
    <div>
      <button class="btn small" id="pollnow">Sondear BDNS ahora</button>
      <button class="btn ghost small" id="out">Salir</button>
    </div>
  </div>
</header>
<main class="wrap cols" style="padding-top:1rem">

  <div class="card" id="alerts-card" hidden>
    <h3 style="color:var(--warn)">⚠ Alertas de ingesta</h3>
    <div id="alerts"></div>
  </div>

  <div class="card" id="contact-card" hidden>
    <h3>Mensajes de contacto <span id="contact-count" class="muted"></span></h3>
    <div id="contact"></div>
  </div>

  <div class="card">
    <h3>Métricas</h3>
    <div id="metrics" class="muted">cargando…</div>
  </div>

  <div class="card" id="notifications-card" hidden>
    <h3>Respuestas de alcaldes</h3>
    <div id="notifications"></div>
  </div>

  <div class="card">
    <h3>Convocatorias <label style="font-weight:400"><input type="checkbox" id="pendingonly" checked style="width:auto"> solo pendientes</label></h3>
    <p id="bulk-bar" style="font-size:.9rem; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap">
      <button class="btn small" id="bulk-publish" type="button">Publicar todas</button>
      <span class="muted" id="bulk-note"></span>
    </p>
    <div id="grants"></div>
  </div>

  <div class="card">
    <h3>Peticiones (señal de demanda)</h3>
    <div id="requests"></div>
  </div>

  <div class="card">
    <h3>Invitaciones</h3>
    <form id="invform" class="row-actions">
      <input name="email" type="email" placeholder="correo" required>
      <input name="name" placeholder="nombre">
      <select name="municipality_id" id="munisel" required></select>
      <button class="btn small" type="submit">Crear invitación</button>
    </form>
    <p id="invlink"></p>
    <div id="invites"></div>
  </div>

</main>
<script>
const $ = (id) => document.getElementById(id);
async function j(url, opts) { const r = await fetch(url, opts); if (r.status === 401) location.href = '/entrar'; return r.json(); }
const post = (url, body) => j(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
// Contact messages are written by anonymous visitors and rendered into innerHTML below,
// so they must be escaped. Everything else on this page comes from BDNS or our own DB.
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('es-ES') + ' €';

async function loadAlerts() {
  const a = await j('/api/op/alerts');
  $('alerts-card').hidden = !a.length;
  $('alerts').innerHTML = a.map(x =>
    `<p>[${x.created_at}] <strong>${x.source}</strong>: ${x.message}
     <button class="btn small" onclick="post('/api/op/alerts/${x.id}/resolve').then(loadAlerts)">resuelto</button></p>`).join('');
}

async function loadContact() {
  const rows = await j('/api/op/contact');
  const unread = rows.filter(r => r.status === 'new').length;
  $('contact-card').hidden = !rows.length;
  $('contact-count').textContent = unread ? `· ${unread} sin leer` : '';
  $('contact').innerHTML = rows.map(r => {
    const place = [r.place_label, r.province].filter(Boolean).join(', ');
    const opts = ['new', 'read', 'replied', 'spam']
      .map(o => `<option value="${o}"${r.status === o ? ' selected' : ''}>${o}</option>`).join('');
    return `<p${r.status === 'new' ? ' style="font-weight:600"' : ''}>
      [${r.received_at}] <strong>${esc(r.name)}</strong>
      &lt;${esc(r.contact)}&gt;${place ? ` · ${esc(place)}` : ''}<br>
      ${esc(r.message)}<br>
      <select onchange="post('/api/op/contact/${r.id}/status', {status: this.value}).then(loadContact)">
        ${opts}
      </select></p>`;
  }).join('') || '<p class="muted">Sin mensajes.</p>';
}

async function loadMetrics() {
  const m = await j('/api/op/metrics');
  const reqs = m.requests.map(r => `${r.k}/${r.status}: ${r.c}`).join(' · ') || '—';
  const base = {};
  for (const b of m.baseline) { (base[b.name] ??= []).push(`${b.yr}: ${b.c} (${fmt(b.eur)})`); }
  $('metrics').innerHTML =
    `<p>Avisadas: <strong>${m.surfaced}</strong> · Interesados: <strong>${m.interested}</strong> ·
     Solicitadas: <strong>${m.applied}</strong> · Concedidas: <strong>${m.awarded}</strong> (${fmt(m.euros_awarded)})</p>
     <p>Peticiones: ${reqs}</p>
     <details><summary>Línea base (concesiones históricas por entidad)</summary>
     ${Object.entries(base).map(([n, ys]) => `<p><strong>${n}</strong>: ${ys.join(' · ')}</p>`).join('')}</details>`;
}

let LISTED = [];   // ids currently listed, for the bulk publish button

async function loadGrants() {
  const pending = $('pendingonly').checked;
  const gs = await j('/api/op/grants' + (pending ? '?q=pending' : ''));
  // Only rows that were actually extracted and are not already live can be bulk published.
  LISTED = gs.filter(g => !g.published && g.ai_summary && g.status !== 'CLOSED').map(g => g.id);
  $('bulk-publish').disabled = !LISTED.length;
  $('bulk-publish').textContent = LISTED.length
    ? `Publicar todas (${LISTED.length})` : 'Publicar todas';
  $('bulk-note').textContent = LISTED.length
    ? `${LISTED.length} sin publicar de ${gs.length} en la lista`
    : 'nada publicable en esta lista';
  $('grants').innerHTML = gs.length ? '' : '<p class="muted">Nada pendiente.</p>';
  for (const g of gs) {
    const d = document.createElement('details');
    d.className = 'card';
    const plazoTag = g.deadline_date
      ? `<span class="tag ${g.deadline_source === 'computed' && !g.deadline_confirmed ? 'warn' : ''}">
         plazo ${g.deadline_date} (${g.deadline_source}${g.deadline_confirmed ? ' ✔' : ' — SIN CONFIRMAR'})</span>`
      : '<span class="tag warn">sin plazo</span>';
    d.innerHTML = `<summary>${g.published ? '🟢' : '⚪'} [${g.status}] ${g.title.slice(0, 110)}</summary>
      <p class="muted">${g.granting_body || ''} · BDNS ${g.bdns_ref} ·
        <a href="${g.source_url}" target="_blank" rel="noopener">ficha</a></p>
      <p>${g.ai_summary || '<em>sin resumen IA</em>'}</p>
      <p>${plazoTag} <span class="tag">${g.category || 's/cat'}</span>
        <span class="tag">benef: ${g.entity_types || '[]'}</span>
        <span class="tag">ámbito: ${g.territory_scope || '¿?'}</span>
        <span class="tag">presupuesto: ${fmt(g.budget_total)}</span></p>
      <div class="row-actions">
        <input type="date" id="dl-${g.id}" value="${g.deadline_date || ''}">
        <button class="btn small" onclick="setDeadline('${g.id}')">fijar plazo (manual)</button>
        ${g.deadline_source === 'computed' && !g.deadline_confirmed
          ? `<button class="btn small" onclick="post('/api/op/grants/${g.id}/deadline',{action:'confirm'}).then(loadGrants)">confirmar calculado</button>` : ''}
        <button class="btn small ${g.published ? 'ghost' : ''}" onclick="publish('${g.id}', ${g.published ? 0 : 1})">
          ${g.published ? 'despublicar' : 'publicar'}</button>
        <button class="btn ghost small" onclick="candidates('${g.id}')">candidatos</button>
      </div>
      <div id="cand-${g.id}"></div>`;
    $('grants').appendChild(d);
  }
}

async function setDeadline(id) {
  const v = $('dl-' + id).value;
  if (!v) return alert('elige fecha');
  const r = await post(`/api/op/grants/${id}/deadline`, { deadline_date: v });
  if (r.error) alert(r.error); else loadGrants();
}
async function publish(id, on) {
  const r = await post(`/api/op/grants/${id}/publish`, { published: !!on });
  if (r.error) alert(r.error); else loadGrants();
}
$('bulk-publish').addEventListener('click', async () => {
  if (!LISTED.length) return;
  if (!confirm(`Publicar ${LISTED.length} convocatorias en el directorio público.\n\n`
    + 'Los resúmenes están redactados automáticamente y las fechas calculadas saldrán '
    + 'marcadas como estimadas (*). ¿Continuar?')) return;
  $('bulk-publish').disabled = true;
  // The endpoint caps a batch at 500.
  let published = 0, skipped = 0;
  for (let i = 0; i < LISTED.length; i += 500) {
    const r = await post('/api/op/grants/publish-batch', { ids: LISTED.slice(i, i + 500) });
    if (r.error) { alert(r.error); break; }
    published += r.published; skipped += r.skipped;
  }
  alert(`Publicadas ${published}${skipped ? ` (${skipped} omitidas)` : ''}.`);
  loadGrants();
});
async function candidates(id) {
  const c = await j(`/api/op/grants/${id}/candidates`);
  $('cand-' + id).innerHTML = c.length
    ? '<table>' + c.map(e => `<tr><td>${e.name}</td><td>${e.type}</td><td>${e.municipality_name}</td>
        <td><button class="btn small" onclick="notify('${id}','${e.id}','whatsapp')">borrador WhatsApp</button>
            <button class="btn small ghost" onclick="notify('${id}','${e.id}','email')">borrador email</button></td></tr>`).join('') + '</table>'
    : '<p class="muted">Sin candidatos según elegibilidad.</p>';
}
async function notify(gid, eid, channel) {
  const r = await post(`/api/op/grants/${gid}/notify`, { entity_id: eid, channel });
  if (r.error) return alert(r.error);
  if (channel === 'whatsapp' && r.whatsapp_sent) {
    $('cand-' + gid).insertAdjacentHTML('beforeend', `<p class="ok">Enviado por WhatsApp ✔</p>`);
  } else if (channel === 'whatsapp' && r.whatsapp_error) {
    $('cand-' + gid).insertAdjacentHTML('beforeend',
      `<p class="error">Fallo al enviar (${esc(r.whatsapp_error)}) - copia manual abajo:</p><pre class="draft">${esc(r.whatsapp_draft)}</pre>`);
  } else {
    $('cand-' + gid).insertAdjacentHTML('beforeend', channel === 'whatsapp'
      ? `<pre class="draft">${esc(r.whatsapp_draft)}</pre>`
      : `<pre class="draft">Asunto: ${esc(r.email_subject)}\n\n${esc(r.email_body)}</pre>`);
  }
  loadMetrics(); loadNotifications();
}

async function loadNotifications() {
  const rows = await j('/api/op/notifications');
  $('notifications-card').hidden = !rows.length;
  $('notifications').innerHTML = rows.length ? '<table>' + rows.map((n) => {
    const tag = n.response === 'interesado' ? '<span class="ok">interesado</span>'
      : n.response === 'no' ? '<span class="muted">no interesa</span>'
      : '<span class="tag warn">sin respuesta</span>';
    return `<tr><td class="muted">${(n.responded_at || n.sent_at).slice(0, 16)}</td>
      <td><strong>${esc(n.municipality)}</strong> · ${esc(n.entity_name)}</td>
      <td>${esc(n.grant_title)}</td><td>${esc(n.channel)}</td><td>${tag}</td></tr>`;
  }).join('') + '</table>' : '';
}

async function loadRequests() {
  const rs = await j('/api/op/requests');
  $('requests').innerHTML = rs.length
    ? '<table>' + rs.map(r => `<tr>
        <td class="muted">${r.received_at.slice(0, 16)}</td>
        <td><strong>${r.municipality_name}</strong> ${r.entity_name ? '· ' + r.entity_name : ''}<br>${r.raw_text}
          <br><span class="tag">${r.consent_upstream ? 'consiente agregado' : 'SIN consentimiento'}</span></td>
        <td class="row-actions" style="min-width:220px">
          <input placeholder="categoría" value="${r.category || ''}" id="cat-${r.id}" style="width:110px">
          <select id="st-${r.id}">${['open', 'matched', 'applied', 'funded', 'no_fit']
            .map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
          <button class="btn small" onclick="catReq('${r.id}')">guardar</button>
        </td></tr>`).join('') + '</table>'
    : '<p class="muted">Sin peticiones.</p>';
}
async function catReq(id) {
  await post(`/api/op/requests/${id}/categorize`,
    { category: $('cat-' + id).value || null, status: $('st-' + id).value });
  loadRequests(); loadMetrics();
}

async function loadInvites() {
  const munis = await j('/api/op/municipalities');
  $('munisel').innerHTML = munis.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  const inv = await j('/api/op/invites');
  $('invites').innerHTML = inv.length
    ? '<table>' + inv.map(i => `<tr><td>${i.email}</td><td>${i.municipality || ''}</td>
       <td>${i.used_at ? '<span class="ok">usada</span>' : 'caduca ' + i.expires_at.slice(0, 10)}</td></tr>`).join('') + '</table>'
    : '';
}
$('invform').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const r = await post('/api/op/invites', {
    email: fd.get('email'), name: fd.get('name'), municipality_id: fd.get('municipality_id') });
  $('invlink').innerHTML = r.link
    ? `Enlace: <code>${r.link.startsWith('http') ? r.link : location.origin + r.link}</code>`
    : (r.error || '');
  loadInvites();
});

$('pollnow').addEventListener('click', async () => {
  $('pollnow').disabled = true; $('pollnow').textContent = 'sondeando…';
  const r = await post('/api/op/poll');
  $('pollnow').disabled = false; $('pollnow').textContent = 'Sondear BDNS ahora';
  alert(r.error || `${r.new} convocatorias nuevas`);
  loadGrants(); loadAlerts();
});
$('pendingonly').addEventListener('change', loadGrants);
$('out').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; });

loadAlerts(); loadContact(); loadMetrics(); loadGrants(); loadRequests(); loadInvites(); loadNotifications();
</script>
</body>
</html>
